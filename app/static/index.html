<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimal Markdown Vault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="topbar-start"><button id="new-note" type="button" title="New note">＋</button><button id="save-note" type="button" title="Save">Save</button></div>
    <button id="toggle-left" type="button" title="Toggle explorer">☰</button>
    <span class="brand">Vault</span>
    <input id="search" type="search" placeholder="Search notes…">
    <select id="filter-tag"><option value="">Tag: all</option></select>
    <select id="filter-status"><option value="">Status: all</option></select>
    <select id="filter-category"><option value="">Category: all</option></select>
    <select id="filter-topic"><option value="">Topic: all</option></select>
    <div class="topbar-end">
      <button id="toggle-preview" type="button">Preview</button>
      <button id="toggle-zen" type="button" title="Zen · Alt+Z">Zen</button>
      <button id="typewriter-toggle" type="button" title="Typewriter · Alt+T">T</button>
      <button id="style-cycle" type="button" title="Style · Alt+S">Standard</button>
      <button id="color-mode" type="button">◐</button>
      <button id="settings-btn" type="button">⚙</button>
      <button id="help-button" type="button" title="Help · Alt+H">?</button>
    </div>
  </header>
  <main id="workspace">
    <aside id="left-panel">
      <div class="panel-header"><span>VAULT</span><button id="collapse-left" type="button">×</button></div>
      <div id="file-tree"></div><div id="search-results"></div>
      <div class="reference-card"><div class="reference-controls"><button id="reindex" type="button">Reindex</button><button id="compile-refs" type="button">References</button></div><span id="ref-count">0</span><pre id="refs-output" hidden></pre></div>
    </aside>
    <div class="resizer" data-target="left" role="separator" aria-label="Resize file panel"></div>
    <section id="center-panel"><div id="tabbar"></div><div id="editor-host"></div><div id="statusbar"><span id="vim-mode">NORMAL</span><span id="cursor-pos">Ln 1, Col 1</span><span id="current-file">No file</span><span id="save-state"></span></div></section>
    <div class="resizer" data-target="right" role="separator" aria-label="Resize preview panel"></div>
    <aside id="right-panel"><div class="panel-header"><select id="right-mode"><option value="preview">Preview</option><option value="references">References</option><option value="backlinks">Backlinks</option></select><button id="collapse-right" type="button">×</button></div><div id="right-content"></div></aside>
  </main>
  <dialog id="help-dialog"><form method="dialog"><h2>Keyboard shortcuts</h2><dl><dt>Alt+H</dt><dd>Help</dd><dt>Alt+Z</dt><dd>Zen</dd><dt>Alt+T</dt><dd>Typewriter</dd><dt>Alt+S</dt><dd>Style</dd><dt>Ctrl/Cmd+S</dt><dd>Save</dd></dl><button value="close">Close</button></form></dialog>
  <dialog id="settings-dialog"><form method="dialog"><h2>Appearance</h2><label>Palette<select id="palette-select"><option value="slate">Slate</option><option value="midnight">Midnight</option><option value="forest">Forest</option><option value="paper">Paper</option><option value="nord">Nord</option><option value="dracula">Dracula</option><option value="solarized-dark">Solarized Dark</option><option value="solarized-light">Solarized Light</option><option value="rose-pine">Rosé Pine</option><option value="everforest">Everforest</option></select></label><label>Font size <span id="font-size-label">14 px</span><input id="font-size" type="range" min="12" max="24" value="14"></label><menu><button value="cancel">Cancel</button><button id="apply-settings" value="ok">Apply</button></menu></form></dialog>
  <dialog id="new-note-dialog"><form id="new-note-form"><h2>New note</h2><label>Folder<input id="new-folder" value="info"></label><label>Filename<input id="new-filename" required></label><label>Template<select id="new-template"></select></label><menu><button id="cancel-create" type="button">Cancel</button><button id="create-note" type="submit">Create</button></menu></form></dialog>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/vim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body></html>
